name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  MAJOR: "1"   # cambia a 2 cuando quieras pasar a la versión 2.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versión
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"                 # tag v1.7 -> 1.7
          else
            V="${MAJOR}.${GITHUB_RUN_NUMBER}"        # cada compilación sube sola: 1.1, 1.2, 1.3...
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versión: $V"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp -Drevision=${{ steps.ver.outputs.version }} clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: BatmanInv-${{ steps.ver.outputs.version }}
          path: target/BatmanInv-*.jar

      # Cada push a main crea un Release nuevo (v1.N) con el jar. Borra este paso si no lo quieres.
      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BatmanInv ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: target/BatmanInv-*.jar
